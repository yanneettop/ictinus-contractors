  <body>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background-color: #F9F7F2;
        opacity: 1;
        transition: opacity 0.5s ease;
      }
      #app-loader.app-loader--hide {
        opacity: 0;
        pointer-events: none;
      }
      /* Column logo "constructs" from the ground up, then breathes */
      #app-loader img {
        width: 120px;
        height: auto;
        animation:
          app-loader-build 1.1s cubic-bezier(0.22, 1, 0.36, 1) both,
          app-loader-breathe 2.4s ease-in-out 1.1s infinite;
      }
      @keyframes app-loader-build {
        0% {
          clip-path: inset(100% 0 0 0);
          opacity: 0;
          transform: translateY(14px);
        }
        100% {
          clip-path: inset(0 0 0 0);
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes app-loader-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      /* Gold level line under the column, filling like a spirit level */
      .app-loader__bar {
        width: 120px;
        height: 2px;
        background: rgba(197, 160, 72, 0.22);
        border-radius: 2px;
        overflow: hidden;
      }
      .app-loader__bar::before {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: #C5A048;
        border-radius: 2px;
        animation: app-loader-sweep 1.3s ease-in-out infinite;
      }
      @keyframes app-loader-sweep {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(310%); }
      }
      /* Wordmark settles in with letter-spacing */
      .app-loader__name {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 15px;
        font-weight: 600;
        color: #202D2D;
        letter-spacing: 0.42em;
        text-indent: 0.42em; /* balance tracking so text is optically centered */
        text-transform: uppercase;
        animation: app-loader-name 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
      }
      @keyframes app-loader-name {
        0% { opacity: 0; letter-spacing: 0.7em; text-indent: 0.7em; }
        100% { opacity: 1; letter-spacing: 0.42em; text-indent: 0.42em; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader img,
        .app-loader__bar::before,
        .app-loader__name { animation: none; }
        #app-loader { transition: none; }
      }
    </style>
    <div id="app-loader" role="status" aria-label="Loading">
      <img src="/logo_trans.png" alt="Ictinus Contractors" width="120" height="120" />
      <div class="app-loader__bar" aria-hidden="true"></div>
      <div class="app-loader__name" aria-hidden="true">Ictinus</div>
    </div>
    <div id="root"></div>
    <script>
      // Prerendered pages already have visible content — skip the loader there.
      (function () {
        var root = document.getElementById('root');
        var loader = document.getElementById('app-loader');
        if (loader && root && root.children.length > 0) {
          loader.remove();
          return;
        }
        // Safety net: never trap the user behind the loader if the app fails to boot.
        setTimeout(function () {
          var l = document.getElementById('app-loader');
          if (!l) return;
          l.classList.add('app-loader--hide');
          setTimeout(function () { l.remove(); }, 500);
        }, 6000);
      })();
    </script>
